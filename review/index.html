<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151419">
  <meta name="robots" content="noindex">
  <title>MOB — 汽车品牌活动与空间设计</title>
  <script>
    (() => {
      const id = location.hash.slice(6);
      if (!location.hash.startsWith('#case/') || !matchMedia('(max-width: 760px)').matches
        || !['phev', 'new-year', 'anniversary', 'yangshuo'].includes(id)) return;
      const preload = document.createElement('link');
      preload.rel = 'preload';
      preload.as = 'image';
      preload.fetchPriority = 'high';
      preload.href = '../preview-3d/fast/hero/' + id + '.webp';
      document.head.append(preload);
    })();
  </script>
  <link rel="stylesheet" href="review.css">
  <script defer src="../assets/js/projects.js"></script>
  <script defer src="../assets/js/profile.js"></script>
  <script defer src="../assets/js/project-notes.js"></script>
  <script defer src="../assets/js/project-stories.js"></script>
  <script defer src="media.js"></script>
  <script defer src="content.js"></script>
  <script defer src="orbit-canvas.js"></script>
  <script defer src="review.js"></script>
<link rel="stylesheet" href="../preview-3d/story-materials.css"><script defer src="../preview-3d/story-catalog.js"></script><script defer src="../preview-3d/story-materials.js"></script><script>document.documentElement.dataset.mobProject=location.hash.split("/")[1]||"";</script><script src="../assets/js/navigation.js"></script></head>
<body>
  <a class="skip" href="#main" data-copy="skip">跳至内容</a>
  <header class="topbar">
    <div class="frame topbar-inner">
      <a class="signature" href="#work">MOB</a>
      <nav id="nav" aria-label="作品集导航">
        <a href="#work" data-copy="work">作品</a>
        <a href="#about" data-copy="about">关于</a>
        <a href="#contact" data-copy="contact">联系</a>
      </nav>
      <button class="language" type="button" aria-label="Switch to English">EN</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <dialog class="viewer" aria-labelledby="viewer-caption">
    <div class="viewer-bar">
      <span id="viewer-caption"></span>
      <button type="button" class="glass" data-viewer="close" data-copy="close">关闭</button>
    </div>
    <div class="viewer-stage" tabindex="0"><img alt=""></div>
    <div class="viewer-bar viewer-controls">
      <button type="button" class="glass" data-viewer="prev" data-copy="previous">上一张</button>
      <span class="viewer-count" aria-live="polite"></span>
      <button type="button" class="glass" data-viewer="zoom" data-copy="zoom">放大</button>
      <button type="button" class="glass" data-viewer="next" data-copy="next">下一张</button>
    </div>
  </dialog>
  <noscript>请启用 JavaScript 浏览作品。 / Enable JavaScript to browse the portfolio.</noscript>
</body>
</html>

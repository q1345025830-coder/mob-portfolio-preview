      <section class="story shell" aria-labelledby="camp">
        <header class="story-heading">
          <h2 id="camp">天幕下的座席</h2>
          <p>天幕贴着车侧展开，桌椅面向展区前沿。屏幕上的青绿色光带衬出车身，低处的球灯照亮座席边界。</p>
        </header>
        <div class="case-spread">

              <span class="expand-mark" aria-hidden="true">↗</span>
            </a>
            <figcaption>
              <div class="figure-key"><strong>展车与天幕座席</strong><span class="figure-kind">方案渲染 · 光影精修</span></div>

            <figcaption>
              <div class="figure-key"><strong>山脊上方的极光</strong><span class="figure-kind">参考摄影</span></div>

            </figcaption>
          </figure>
        </div>
        <figure class="case-figure case-follow">
            <a class="media-link" href="../assets/images/volvo-music-festival/03-2560.jpg" data-view-image="2" aria-label="查看大图：后备箱与补给亭 · 夜景">

              <span class="expand-mark" aria-hidden="true">↗</span>
            </a>
            <figcaption>
              <div class="figure-key"><strong>后备箱与补给亭 · 夜景</strong><span class="figure-kind">方案渲染 · 光影精修</span></div>
              <p>草地方案把座席移到打开的车尾。野餐桌贴近后备箱，一串灯从桌旁连到补给亭。</p>
